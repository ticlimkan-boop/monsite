<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <main class="school-app">
        <header class="school-app__header">
            <h1>Gestion scolaire</h1>
            <button id="refresh-button">Actualiser</button>
            <div id="feedback" class="feedback" aria-live="polite"></div>
        </header>
        <section class="school-app__grid">
            <article class="card">
                <h2>1. Inscrire un élève</h2>
                <form id="student-form" class="school-form">
                    <label>Nom complet
                        <input type="text" id="student-name" placeholder="Ex. Awa Diop" required>
                    </label>
                    <label>Date de naissance
                        <input type="date" id="student-birth" required>
                    </label>
                    <label>Classe
                        <select id="student-class"></select>
                    </label>
                    <button type="submit">Enregistrer l'élève</button>
                </form>
            </article>
           <article class="card">
                <h2>2. Ajouter une classe</h2>
                <form id="class-form" class="school-form">
                    <label>Nom de la classe
                        <input type="text" id="class-name" placeholder="Ex. 6e A" required>
                    </label>
                    <button type="submit">Ajouter la classe</button>
                </form>
            </article>
            <article class="card">
                <h2>3.  professeur</h2>
                <form id="teacher-form" class="school-form">
                    <label>Nom du professeur
                        <input type="text" id="teacher-name" placeholder="">
                    </label>
                    <label>Matières (séparées par des virgules)
                        <input type="text" id="teacher-subjects" placeholder="Mathématiques, Histoire" required>
                    </label>
                    <button type="submit">Ajouter le professeur</button>
                </form>
            </article>

            <article class="card">
                <h2>4. Affecter un professeur</h2>
                <form id="assignment-form" class="school-form">
                    <label>Classe
                        <select id="assignment-class"></select>
                    </label>
                    <label>Professeur
                        <select id="assignment-teacher"></select>
                    </label>
                    <label>Matière
                        <select id="assignment-subject"></select>
                    </label>
                    <button type="submit">Enregistrer l'affectation</button>
                </form>
            </article>
            <article class="card">
                <h2>5. Ajouter une note</h2>
                <form id="grade-form" class="school-form">
                    <label>Classe
                        <select id="grade-class"></select>
                    </label>
                    <label>Élève
                        <select id="grade-student"></select>
                    </label>
                    <label>Professeur
                        <select id="grade-teacher"></select>
                    </label>
                    <label>Matière
                        <select id="grade-subject"></select>
                    </label>
                    <label>Note / 20
                        <input type="number" id="grade-score" name="grade-score" min="0" max="20" step="0.1" required>
                    </label>
                    <button type="submit">Enregistrer la note</button>
                </form>
            </article>
        </section>
